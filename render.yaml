# Render Blueprint, free plan. See deploy/RENDER.md
services:
  - type: web
    name: emoqa-website
    runtime: node
    region: singapore # closest to India
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /blogs/
    envVars:
      - key: NODE_VERSION
        value: 22.23.5
      - key: EPHEMERAL_STORAGE # free instances lose their files on every restart
        value: "1"
      - key: CLIENT_IP_HEADER # Render traffic arrives through Cloudflare
        value: cf-connecting-ip
